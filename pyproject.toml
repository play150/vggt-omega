[project]
name = "vggt-omega"
version = "0.0.1"
description = "VGGT-Omega feed-forward camera and depth reconstruction."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Jianyuan Wang", email = "jianyuan@robots.ox.ac.uk"},
]
dependencies = [
    "numpy<2",
    "Pillow",
    "einops",
    "safetensors",
    "opencv-python",
    "gradio==5.50.0",
    "gradio-client==1.14.0",
    "trimesh>=5.1.0,<6",
    "matplotlib>=3.11.2,<4",
    "scipy>=1.17.1,<2",
    "requests>=2.34.2,<3",
    "onnxruntime>=1.30.0,<2",
]

[project.optional-dependencies]
demo = [
    "gradio>=5.17.1",
    "viser>=0.2.23",
    "tqdm",
    "scipy",
    "trimesh",
    "matplotlib",
    "requests",
    "onnxruntime",
]
export = [
    "pycolmap>=3.10.0",
]
train = [
    "torch>=2.6",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "fvcore",
    "tensorboard",
    "wcmatch",
]
curation = [
    "catboost",
    "joblib",
    "lightgbm",
    "scikit-learn>=1.4",
    "scipy",
    "xgboost",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vggt_omega*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
vggt-omega = { path = ".", editable = true }

torch = { version = ">=2.6", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = ">=0.21", index = "https://download.pytorch.org/whl/cu124" }

[tool.pixi.environments]
default = { solve-group = "default" }
curation = { features = ["curation"], solve-group = "default" }
demo = { features = ["demo"], solve-group = "default" }
export = { features = ["export"], solve-group = "default" }
train = { features = ["train"], solve-group = "default" }

[tool.pixi.tasks]
